<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ferð</title>
<meta name="description" content="A clean live flight map.">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1217" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ferð">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230e1217'/%3E%3Cpath fill='%2367c6d6' transform='translate(3 3) scale(.75)' d='M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #f6f7f9; --panel: rgba(255,255,255,.92); --ink: #12161c; --muted: #6b7380;
    --line: rgba(18,22,28,.10); --accent: #0f8fa3;
    --ground: #9aa1ab; --low: #e0912b; --mid: #0f8fa3; --high: #5b5bd6;
    --shadow: 0 6px 24px rgba(15,20,30,.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1217; --panel: rgba(22,27,34,.92); --ink: #e8ecf1; --muted: #8b94a1;
      --line: rgba(232,236,241,.10); --accent: #67c6d6;
      --ground: #6b7380; --low: #f0a84a; --mid: #67c6d6; --high: #9d9dff;
      --shadow: 0 6px 24px rgba(0,0,0,.45);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; }
  #map { position: fixed; inset: 0; background: var(--bg); }
  .leaflet-tile-pane { filter: grayscale(.85) contrast(.92) brightness(1.04); }
  @media (prefers-color-scheme: dark) {
    .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) grayscale(.7) brightness(.82) contrast(.92); }
  }

  .bar { position: fixed; z-index: 1000; left: 12px; right: 12px;
    top: calc(env(safe-area-inset-top) + 12px);
    display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 16px;
    background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
  .brand { font-weight: 700; letter-spacing: .02em; font-size: 18px; }
  .bar input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    color: var(--ink); font: inherit; font-size: 16px; /* 16px stops iOS zooming on focus */
    padding: 6px 4px; text-transform: uppercase; }
  .bar input::placeholder { color: var(--muted); text-transform: none; }
  .status { position: fixed; z-index: 1000; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top) + 70px); font-size: 12px; color: var(--muted);
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 10px; white-space: nowrap; box-shadow: var(--shadow);
    max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }

  .fab { position: fixed; z-index: 1000; right: 12px; width: 44px; height: 44px;
    border-radius: 14px; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); box-shadow: var(--shadow); display: grid; place-items: center;
    cursor: pointer; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .fab svg { width: 22px; height: 22px; }
  #locate { bottom: calc(env(safe-area-inset-bottom) + 24px); }
  body.sheet-open #locate { bottom: calc(env(safe-area-inset-bottom) + 268px); }

  .suggest { position: fixed; z-index: 1002; left: 12px; right: 12px;
    top: calc(env(safe-area-inset-top) + 70px); max-height: min(60vh, 440px); overflow-y: auto;
    background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
    padding: 6px; display: none; }
  .suggest.open { display: block; }
  .sg-h { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em;
    padding: 8px 10px 4px; }
  .sg { display: flex; align-items: baseline; gap: 10px; padding: 9px 10px; border-radius: 10px; cursor: pointer; }
  .sg.act { background: var(--line); }
  .sg b { min-width: 44px; font-weight: 700; letter-spacing: .02em; }
  .sg .n { flex: 1; min-width: 0; color: var(--muted); font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sg .c { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .sg-empty { padding: 10px; color: var(--muted); font-size: 13px; }
  .sg .rm { border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1;
    padding: 0 2px 0 8px; cursor: pointer; align-self: center; }

  .filter { position: fixed; z-index: 1000; left: 12px; top: calc(env(safe-area-inset-top) + 70px);
    display: none; align-items: center; gap: 4px; padding: 4px 4px 4px 12px;
    background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); font-size: 13px;
    flex-wrap: wrap; max-width: calc(100vw - 24px); }
  body.filtering .filter { display: flex; }
  body.filtering .status { top: calc(env(safe-area-inset-top) + 78px + var(--fh, 38px)); }
  .filter.pair { border-radius: 16px; padding: 6px 4px 4px 12px; row-gap: 4px; }
  .filter.pair b { flex: 1; }
  .filter.pair .close { order: 1; }
  .filter.pair .seg { order: 2; flex-basis: 100%; margin-left: -8px; }
  .filter b { margin-right: 4px; letter-spacing: .02em; }
  .seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px;
    padding: 5px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .seg button.on { background: var(--accent); color: #fff; }
  .filter .close { font-size: 18px; padding: 0 8px; }
  .ac.dim .p { opacity: .16; }

  body.fs-open #locate { display: none; }
  #fs { max-height: calc(100vh - env(safe-area-inset-top) - 140px); overflow-y: auto; }
  .days { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; }
  .days button { border: 1px solid var(--line); background: transparent; color: var(--muted); font: inherit;
    font-size: 12px; padding: 4px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .days button.on { background: var(--accent); border-color: transparent; color: #fff; }
  .state { margin-top: 12px; font-weight: 700; font-size: 16px; }
  .state small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
  .good { color: #1f9d55; } .warn { color: #d98a00; } .bad { color: #d64545; }
  @media (prefers-color-scheme: dark) { .good { color: #4cc38a; } .warn { color: #f0b429; } .bad { color: #f07070; } }
  .legs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .leg .ap { font-weight: 700; } .leg .city { color: var(--muted); font-size: 13px; }
  .leg .t { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .leg .s { color: var(--muted); font-size: 12px; }
  .inb { margin-top: 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; font-size: 14px; }
  .inb .k { margin-bottom: 4px; }
  .inb .verdict { margin-top: 6px; font-weight: 600; }
  .fs-msg { margin-top: 12px; color: var(--muted); font-size: 14px; }
  .path { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 6px; margin-top: 6px; font-size: 14px; color: var(--muted); }
  .path .ap { border: 0; background: transparent; padding: 0; font: inherit; font-weight: 700;
    color: var(--accent); cursor: pointer; }
  .path .arrow { margin: 0 2px; }

  .ac { background: none; border: 0; }
  .ac .p { width: 26px; height: 26px; transition: transform .6s linear; }
  .ac svg { width: 100%; height: 100%; display: block;
    filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.35)); }
  .p.g svg { fill: var(--ground); } .p.l svg { fill: var(--low); }
  .p.m svg { fill: var(--mid); }    .p.h svg { fill: var(--high); }
  .ac.sel .p svg { fill: var(--ink); filter: drop-shadow(0 0 4px var(--accent)); }
  .me { width: 14px; height: 14px; border-radius: 50%; background: var(--accent);
    border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(15,143,163,.2); }

  .sheet { position: fixed; z-index: 1001; left: 12px; right: 12px;
    bottom: calc(env(safe-area-inset-bottom) + 12px);
    background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow);
    padding: 16px 18px 18px; transform: translateY(0); transition: transform .25s ease, opacity .25s; }
  .sheet.hidden { transform: translateY(120%); opacity: 0; pointer-events: none; }
  .sheet-head { display: flex; align-items: baseline; gap: 10px; }
  .cs { font-size: 24px; font-weight: 700; letter-spacing: .02em; }
  .sub { color: var(--muted); font-size: 13px; flex: 1; }
  .close { border: 0; background: transparent; color: var(--muted); font-size: 22px;
    line-height: 1; cursor: pointer; padding: 0 2px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 10px; margin-top: 14px; }
  .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .v { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 8px; margin-top: 16px; }
  .btn { flex: 1; text-align: center; text-decoration: none; font: inherit; font-size: 14px;
    font-weight: 600; padding: 10px; border-radius: 12px; border: 1px solid var(--line);
    background: transparent; color: var(--ink); cursor: pointer; }
  .btn.on { background: var(--accent); color: #fff; border-color: transparent; }

  .leaflet-control-attribution { background: var(--panel) !important; color: var(--muted) !important;
    font-size: 10px !important; border-radius: 8px 0 0 0; }
  .leaflet-control-attribution a { color: var(--muted) !important; }
  @media (min-width: 640px) {
    .bar { right: auto; width: 380px; }
    .status { left: 404px; transform: none; top: calc(env(safe-area-inset-top) + 22px); }
    .sheet { right: auto; width: 380px; }
    body.sheet-open #locate { bottom: calc(env(safe-area-inset-bottom) + 24px); }
    .suggest { right: auto; width: 380px; }
    body.filtering .status { top: calc(env(safe-area-inset-top) + 22px); }
  }
</style>
</head>
<body>
<div id="map"></div>

<header class="bar">
  <div class="brand">ferð</div>
  <input id="q" type="search" placeholder="Flight, airport or city" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="search">
</header>
<div class="suggest" id="suggest" role="listbox"></div>
<div class="filter" id="filter">
  <b id="f-code"></b>
  <div class="seg" id="f-seg">
    <button data-dir="all">All</button><button data-dir="dep">Departing</button><button data-dir="arr">Arriving</button>
  </div>
  <button class="close" id="f-x" aria-label="Clear airport filter">×</button>
</div>
<div class="status" id="status">Loading…</div>

<button class="fab" id="locate" aria-label="Go to my location">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
</button>

<section class="sheet hidden" id="sheet" aria-live="polite">
  <div class="sheet-head">
    <div class="cs" id="s-cs">—</div>
    <div class="sub" id="s-sub"></div>
    <button class="close" id="s-close" aria-label="Close">×</button>
  </div>
  <div class="path" id="s-path"></div>
  <div class="grid">
    <div><div class="k">Altitude</div><div class="v" id="s-alt">—</div></div>
    <div><div class="k">Speed</div><div class="v" id="s-spd">—</div></div>
    <div><div class="k">Heading</div><div class="v" id="s-hdg">—</div></div>
    <div><div class="k">Vertical</div><div class="v" id="s-vr">—</div></div>
    <div><div class="k">Squawk</div><div class="v" id="s-sq">—</div></div>
    <div><div class="k">ICAO24</div><div class="v" id="s-id">—</div></div>
  </div>
  <div class="actions">
    <button class="btn" id="s-follow">Follow</button>
    <button class="btn" id="s-status">Status</button>
    <a class="btn" id="s-route" target="_blank" rel="noopener">FlightAware ↗</a>
  </div>
</section>

<section class="sheet hidden" id="fs" aria-live="polite">
  <div class="sheet-head">
    <div class="cs" id="fs-id">—</div>
    <div class="sub" id="fs-sub"></div>
    <button class="close" id="fs-close" aria-label="Close">×</button>
  </div>
  <div id="fs-body"></div>
  <div class="actions">
    <button class="btn" id="fs-save">☆ Save</button>
    <button class="btn" id="fs-show">Show plane</button>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
  // The ADS-B feeds don't allow direct browser access, so requests go through
  // the ferd relay (relay/worker.js, a Cloudflare Worker). Set its URL here.
  const RELAY = 'https://ferd-relay.havards.workers.dev';
  const MAX_NM = 250;
  const REFRESH_MS = 15000;   // OpenSky account: 4,000 credits/day
  const MIN_GAP_MS = 4000;    // never fetch more often than this, even when panning
  const PLANE = '<svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>';

  // ICAO airline code (what ADS-B callsigns use) -> [IATA code, name]
  const AIRLINES = {
    NOZ: ['DY', 'Norwegian'], NAX: ['DY', 'Norwegian'], NBT: ['N0', 'Norse Atlantic'],
    SAS: ['SK', 'SAS'], WIF: ['WF', 'Widerøe'], FIN: ['AY', 'Finnair'], ICE: ['FI', 'Icelandair'],
    BTI: ['BT', 'airBaltic'], BAW: ['BA', 'British Airways'], SHT: ['BA', 'British Airways'],
    CFE: ['BA', 'BA CityFlyer'], EFW: ['BA', 'BA Euroflyer'], VIR: ['VS', 'Virgin Atlantic'],
    EZY: ['U2', 'easyJet'], EJU: ['EC', 'easyJet Europe'], EZS: ['DS', 'easyJet Switzerland'],
    RYR: ['FR', 'Ryanair'], RUK: ['RK', 'Ryanair UK'], WZZ: ['W6', 'Wizz Air'], WUK: ['W9', 'Wizz Air UK'],
    EXS: ['LS', 'Jet2'], TOM: ['BY', 'TUI'], LOG: ['LM', 'Loganair'], EIN: ['EI', 'Aer Lingus'],
    KLM: ['KL', 'KLM'], AFR: ['AF', 'Air France'], TRA: ['HV', 'Transavia'], TVF: ['TO', 'Transavia France'],
    DLH: ['LH', 'Lufthansa'], CLH: ['LH', 'Lufthansa CityLine'], EWG: ['EW', 'Eurowings'],
    SWR: ['LX', 'Swiss'], AUA: ['OS', 'Austrian'], BEL: ['SN', 'Brussels Airlines'],
    IBE: ['IB', 'Iberia'], VLG: ['VY', 'Vueling'], TAP: ['TP', 'TAP Air Portugal'], ITY: ['AZ', 'ITA Airways'],
    AEE: ['A3', 'Aegean'], LOT: ['LO', 'LOT'], CSA: ['OK', 'Czech Airlines'], THY: ['TK', 'Turkish Airlines'],
    PGT: ['PC', 'Pegasus'], ELY: ['LY', 'El Al'], UAE: ['EK', 'Emirates'], QTR: ['QR', 'Qatar Airways'],
    ETD: ['EY', 'Etihad'], GFA: ['GF', 'Gulf Air'], OMA: ['WY', 'Oman Air'], SVA: ['SV', 'Saudia'],
    AIC: ['AI', 'Air India'], IGO: ['6E', 'IndiGo'], SIA: ['SQ', 'Singapore Airlines'], CPA: ['CX', 'Cathay Pacific'],
    ANA: ['NH', 'ANA'], JAL: ['JL', 'Japan Airlines'], KAL: ['KE', 'Korean Air'], QFA: ['QF', 'Qantas'],
    ANZ: ['NZ', 'Air New Zealand'], ETH: ['ET', 'Ethiopian'], MSR: ['MS', 'EgyptAir'], RAM: ['AT', 'Royal Air Maroc'],
    SAA: ['SA', 'South African'], AAL: ['AA', 'American'], DAL: ['DL', 'Delta'], UAL: ['UA', 'United'],
    ACA: ['AC', 'Air Canada'], JBU: ['B6', 'JetBlue'], SWA: ['WN', 'Southwest'], ASA: ['AS', 'Alaska']
  };
  // Flight number from a callsign, only when the suffix is purely numeric
  // (many airlines, e.g. BA and easyJet, often use alphanumeric callsigns that don't map).
  function flightInfo(cs) {
    const m = /^([A-Z]{3})(\d{1,4})$/.exec(cs || '');
    const al = AIRLINES[(cs || '').slice(0, 3)];
    return {
      airline: al ? al[1] : '',
      flightNo: m && al ? al[0] + String(Number(m[2])) : ''
    };
  }

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // Upper-case and strip accents so "tromso" finds Tromsø
  const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase()
    .replace(/Ø/g, 'O').replace(/Æ/g, 'AE');

  // ---------- routes ----------
  // ADS-B doesn't carry origin/destination, so routes come from the adsb.lol copy of the
  // Virtual Radar Server standing data: one static JSON file per callsign, CORS-enabled.
  // These are scheduled routes, so occasionally wrong for a given day.
  const ROUTES = 'https://vrs-standing-data.adsb.lol/routes';
  const routes = new Map();        // callsign -> [airport key, ...] or null (unknown)
  const airportInfo = new Map();   // airport key (IATA, else ICAO) -> { key, iata, icao, name, city }
  const routeQueue = [], routeWanted = new Set();
  let routeActive = 0, routesTimer = null;
  const isAirlineCs = cs => /^[A-Z]{3}\d[A-Z0-9]{0,3}$/.test(cs);

  function parseRoute(j) {
    const stops = (j._airports || []).map(a => {
      const key = a.iata || a.icao;
      if (key && !airportInfo.has(key)) {
        airportInfo.set(key, { key, iata: a.iata || '', icao: a.icao || '', name: a.name || '', city: a.location || '' });
      }
      return key;
    }).filter(Boolean);
    return stops.length >= 2 ? stops : null;
  }
  async function fetchRoute(cs) {
    let route = null;
    try {
      const r = await fetch(`${ROUTES}/${cs.slice(0, 2)}/${cs}.json`, { signal: AbortSignal.timeout(10000) });
      if (r.ok) route = parseRoute(await r.json());
      else if (r.status !== 404) return;   // transient: try again on a later refresh
    } catch { return; }
    routes.set(cs, route);
    clearTimeout(routesTimer);
    routesTimer = setTimeout(routesChanged, 250);
  }
  function pumpRoutes() {
    while (routeActive < 8 && routeQueue.length) {
      const cs = routeQueue.shift();
      routeActive++;
      fetchRoute(cs).finally(() => { routeActive--; routeWanted.delete(cs); pumpRoutes(); });
    }
  }
  function wantRoute(cs, urgent = false) {
    if (!isAirlineCs(cs) || routes.has(cs)) return;
    const i = routeQueue.indexOf(cs);
    if (urgent && i > 0) { routeQueue.splice(i, 1); routeQueue.unshift(cs); }
    else if (!routeWanted.has(cs)) { routeWanted.add(cs); urgent ? routeQueue.unshift(cs) : routeQueue.push(cs); }
    pumpRoutes();
  }
  const routeOf = d => routes.get(d.cs.toUpperCase()) || null;
  const apCode = k => { const a = airportInfo.get(k); return a ? (a.iata || a.icao) : k; };

  // ---------- airport filter ----------
  // filter = { a: side, b: side | null, dir }
  //   one airport:  dir 'all' | 'dep' | 'arr'
  //   two airports: dir 'both' | 'ab' (a -> b) | 'ba' (b -> a)
  // side = { label, code: true, q: 'LHR' }        an airport code
  //      | { label, code: false, q: 'LONDON' }    a city/name, matching every airport it fits
  let filter = null;
  const codeSide = key => ({ label: apCode(key), code: true, q: norm(apCode(key)) });
  function sideHas(side, key) {
    const a = airportInfo.get(key);
    if (side.code) return norm(key) === side.q || (!!a && (norm(a.iata) === side.q || norm(a.icao) === side.q));
    const s = a ? scoreAirport(a, side.q) : -1;
    return s >= 0 && s <= 4;
  }
  function matchFilter(d, f, dir) {
    const st = routeOf(d);
    if (!st) return false;
    const idx = side => st.map((k, i) => (sideHas(side, k) ? i : -1)).filter(i => i >= 0);
    const ia = idx(f.a);
    if (!ia.length) return false;
    if (!f.b) return dir === 'all' || ia.some(i => (dir === 'dep' ? i < st.length - 1 : i > 0));
    const ib = idx(f.b);
    return ia.some(i => ib.some(j => i !== j && (dir === 'both' || (dir === 'ab' ? i < j : j < i))));
  }
  // Departures/arrivals per airport among the aircraft currently loaded
  function airportCounts() {
    const m = new Map();
    for (const p of planes.values()) {
      const st = routeOf(p.d);
      if (!st) continue;
      st.forEach((k, i) => {
        let c = m.get(k);
        if (!c) { c = { dep: 0, arr: 0 }; m.set(k, c); }
        if (i < st.length - 1) c.dep++;
        if (i > 0) c.arr++;
      });
    }
    return m;
  }
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  // ---------- map ----------
  const saved = store.get('ferd:view');
  const map = L.map('map', { zoomControl: false, worldCopyJump: true })
    .setView(saved ? [saved.lat, saved.lon] : [51.5, -0.12], saved ? saved.z : 9);

  const darkMq = matchMedia('(prefers-color-scheme: dark)');
  // OpenStreetMap tiles (no key). Light/dark styling is done with a CSS filter on the tile pane.
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · ADS-B: adsb.lol / adsb.fi / airplanes.live · Routes: adsb.lol'
  }).addTo(map);

  // ---------- state ----------
  const planes = new Map();   // icao24 -> { m, d, base }
  let selected = null, follow = false, lastFetch = 0, pending = null, blockedUntil = 0;

  const setStatus = t => { $('status').textContent = t; };

  function band(d) {
    if (d.ground) return 'g';
    const ft = d.alt || 0;
    return ft < 10000 ? 'l' : ft < 30000 ? 'm' : 'h';
  }
  const isDim = d => !!filter && d.id !== selected && !matchFilter(d, filter, filter.dir);
  const iconKey = d => band(d) + (isDim(d) ? 'd' : '') + (d.id === selected ? 's' : '');
  function setIconFor(p) { p.m.setIcon(makeIcon(p.d)); p.key = iconKey(p.d); }
  function refreshIcons() { for (const p of planes.values()) if (iconKey(p.d) !== p.key) setIconFor(p); }
  function makeIcon(d) {
    return L.divIcon({
      className: 'ac' + (d.id === selected ? ' sel' : '') + (isDim(d) ? ' dim' : ''),
      iconSize: [26, 26], iconAnchor: [13, 13],
      html: `<div class="p ${band(d)}" style="transform:rotate(${d.trk}deg)">${PLANE}</div>`
    });
  }

  // ---------- data ----------
  async function load() {
    if (document.hidden) return;
    const now = Date.now();
    if (now < blockedUntil) return;
    const c = map.getCenter().wrap();
    const corner = map.getBounds().getNorthEast();
    const viewNm = map.distance(c, corner) / 1852;
    const nm = Math.min(MAX_NM, Math.ceil(viewNm));
    lastFetch = now;
    const la = c.lat.toFixed(3), lo = c.lng.toFixed(3);
    if (RELAY.includes('REPLACE-ME')) { setStatus('Relay not set up yet'); return; }
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 25000);
      const r = await fetch(`${RELAY}/near?lat=${la}&lon=${lo}&nm=${nm}`, { signal: ctrl.signal });
      clearTimeout(timer);
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.detail ? j.detail.join(', ') : `HTTP ${r.status}`);
      update(j.ac || []);
      const t = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const capped = viewNm > MAX_NM ? ` · within ${MAX_NM} nm of centre` : '';
      setStatus(`${planes.size} aircraft${capped}${j.stale ? ' · delayed' : ` · ${t}`}`);
    } catch (e) {
      blockedUntil = Date.now() + 20000;
      setStatus(`No flight data (${e.name === 'AbortError' ? 'timed out' : e.message || e.name})`);
    }
  }

  function update(list) {
    const seen = new Set();
    const t = performance.now();
    for (const a of list) {
      const { hex: id, lat, lon } = a;
      if (!id || lat == null || lon == null) continue;
      if (a.seen_pos != null && a.seen_pos > 60) continue;   // stale position
      seen.add(id);
      const ground = a.alt_baro === 'ground';
      const alt = ground ? 0 : (typeof a.alt_baro === 'number' ? a.alt_baro : a.alt_geom);
      const d = { id, cs: (a.flight || '').trim(), reg: a.r || '', type: a.t || '',
                  lat, lon, alt, ground, vel: a.gs || 0, trk: a.track ?? a.true_heading ?? 0,
                  vr: a.baro_rate ?? a.geom_rate, sq: a.squawk };
      Object.assign(d, flightInfo(d.cs.toUpperCase()));
      wantRoute(d.cs.toUpperCase());
      let p = planes.get(id);
      if (!p) {
        const m = L.marker([lat, lon], { icon: makeIcon(d), keyboard: false })
          .on('click', () => select(id)).addTo(map);
        p = { m, key: iconKey(d) };
        planes.set(id, p);
      } else {
        p.m.setLatLng([lat, lon]);
      }
      p.d = d;
      p.base = { lat, lon, t };
      if (iconKey(d) !== p.key) setIconFor(p);
      else {
        const el = p.m.getElement()?.firstChild;
        if (el) el.style.transform = `rotate(${d.trk}deg)`;
      }
    }
    for (const [id, p] of planes) {
      if (!seen.has(id) && id !== selected) { map.removeLayer(p.m); planes.delete(id); }
    }
    if (selected) renderSheet();
    if (filter) renderFilter();
    if ($('suggest').classList.contains('open')) renderSuggest();
    if (pendingFind) {   // "Show plane" moved the map here: select it once it shows up
      const p = findPlane(pendingFind.t);
      if (p) { pendingFind = null; select(p.d.id); }
      else if (Date.now() > pendingFind.until) pendingFind = null;
    }
  }

  function routesChanged() {
    refreshIcons();
    if (selected) renderSheet();
    if (filter) renderFilter();
    if ($('suggest').classList.contains('open')) renderSuggest();
  }

  // Dead-reckon between refreshes so aircraft glide rather than jump.
  function animate() {
    const now = performance.now();
    for (const p of planes.values()) {
      const d = p.d;
      if (d.ground || !d.vel) continue;
      const dt = Math.min((now - p.base.t) / 1000, 90);
      const dist = d.vel * 0.514444 * dt, rad = d.trk * Math.PI / 180;
      const lat = p.base.lat + (dist * Math.cos(rad)) / 111320;
      const lon = p.base.lon + (dist * Math.sin(rad)) / (111320 * Math.cos(p.base.lat * Math.PI / 180));
      p.m.setLatLng([lat, lon]);
      if (follow && d.id === selected) map.panTo([lat, lon], { animate: true, duration: 0.8 });
    }
  }

  // ---------- selection / sheet ----------
  function select(id) {
    const prev = selected;
    selected = id;
    if (prev && planes.has(prev)) { const q = planes.get(prev); setIconFor(q); q.m.setZIndexOffset(0); }
    const p = planes.get(id);
    if (!p) return;
    if (fsData) closeFs();
    setIconFor(p);
    p.m.setZIndexOffset(1000);
    wantRoute(p.d.cs.toUpperCase(), true);
    $('sheet').classList.remove('hidden');
    document.body.classList.add('sheet-open');
    renderSheet();
  }
  function deselect() {
    const p = planes.get(selected);
    selected = null; follow = false;
    if (p) { setIconFor(p); p.m.setZIndexOffset(0); }
    $('sheet').classList.add('hidden');
    document.body.classList.remove('sheet-open');
    $('s-follow').classList.remove('on');
  }
  function renderSheet() {
    const p = planes.get(selected);
    if (!p) return;
    const d = p.d;
    const ft = d.alt != null ? Math.round(d.alt) : null;
    $('s-cs').textContent = d.flightNo || d.cs || d.reg || d.id.toUpperCase();
    $('s-sub').textContent = [d.airline, d.flightNo ? d.cs : '', d.type, d.reg].filter(Boolean).join(' · ');
    const cs = d.cs.toUpperCase(), st = routeOf(d), path = $('s-path');
    if (st) {
      path.innerHTML = st.map(k => {
        const a = airportInfo.get(k);
        return `<button class="ap" data-ap="${esc(k)}" title="${esc(a?.name)}">${esc(apCode(k))}</button>`
          + (a?.city ? `<span>${esc(a.city)}</span>` : '');
      }).join('<span class="arrow">→</span>');
    } else {
      path.textContent = !isAirlineCs(cs) ? '' : routes.has(cs) ? 'Route not known' : 'Looking up route…';
    }
    path.style.display = path.textContent ? '' : 'none';
    $('s-alt').textContent = d.ground ? 'Ground' : ft != null ? `${ft.toLocaleString()} ft` : '—';
    $('s-spd').textContent = d.vel ? `${Math.round(d.vel)} kt` : '—';
    $('s-hdg').textContent = `${Math.round(d.trk)}°`;
    $('s-vr').textContent = d.vr != null && !d.ground
      ? `${d.vr > 0 ? '+' : ''}${Math.round(d.vr).toLocaleString()} fpm` : '—';
    $('s-sq').textContent = d.sq || '—';
    $('s-id').textContent = d.id.toUpperCase();
    $('s-status').style.display = isAirlineCs(cs) ? '' : 'none';
    const route = $('s-route');
    if (d.cs) { route.href = `https://www.flightaware.com/live/flight/${encodeURIComponent(d.cs)}`; route.style.display = ''; }
    else route.style.display = 'none';
  }

  $('s-close').onclick = deselect;
  $('s-follow').onclick = () => {
    follow = !follow;
    $('s-follow').classList.toggle('on', follow);
    const p = planes.get(selected);
    if (follow && p) map.panTo(p.m.getLatLng());
  };
  map.on('click', deselect);
  map.on('dragstart', () => { if (follow) { follow = false; $('s-follow').classList.remove('on'); } });

  $('s-path').addEventListener('click', e => {
    const b = e.target.closest('[data-ap]');
    if (b) setFilter({ a: codeSide(b.dataset.ap), b: null, dir: 'all' });
  });

  // ---------- airport filter UI ----------
  function setFilter(f) {
    filter = f || null;
    document.body.classList.toggle('filtering', !!filter);
    renderFilter();
    refreshIcons();
  }
  const sideTitle = side => {
    if (!side.code) return '';
    const a = [...airportInfo.values()].find(x => norm(x.iata) === side.q || norm(x.icao) === side.q);
    return a ? a.name : '';
  };
  function renderFilter() {
    if (!filter) return;
    const { a, b } = filter;
    $('f-code').textContent = b ? `${a.label} ⇄ ${b.label}` : a.label;
    $('f-code').title = [sideTitle(a), b && sideTitle(b)].filter(Boolean).join(' ⇄ ');
    const dirs = b
      ? [['both', 'Both ways'], ['ab', `To ${b.label}`], ['ba', `To ${a.label}`]]
      : [['all', 'All'], ['dep', 'Departing'], ['arr', 'Arriving']];
    $('f-seg').innerHTML = dirs.map(([dir, label]) => {
      let n = 0;
      for (const p of planes.values()) if (matchFilter(p.d, filter, dir)) n++;
      return `<button data-dir="${dir}" class="${dir === filter.dir ? 'on' : ''}">${esc(label)} ${n}</button>`;
    }).join('');
    $('filter').classList.toggle('pair', !!b);
    document.body.style.setProperty('--fh', `${$('filter').offsetHeight}px`);
  }
  $('f-seg').addEventListener('click', e => {
    const dir = e.target.dataset?.dir;
    if (dir && filter) { filter.dir = dir; renderFilter(); refreshIcons(); }
  });
  $('f-x').onclick = () => setFilter(null);

  // ---------- flight status (FlightAware via the relay) ----------
  // fsData = { ident, flights, index, inbound } for the open panel; fsShow = which flight is displayed
  let fsData = null, fsShow = -1, fsTimer = null, pendingFind = null;
  const FS_REFRESH_MS = 180000;   // each refresh costs FlightAware credit, so not too often
  const isFlightNo = q => /^([A-Z]{2}|[A-Z]\d|\d[A-Z]|[A-Z]{3})\d{1,4}[A-Z]?$/.test(q);

  // Saved flights. A flight has several numbers (BA2702, EFW2702, FlightAware's AO2702), so a saved
  // entry matches a flight if any of them agree and the departure time is the same.
  const trips = {
    all() { return (store.get('ferd:trips') || []).filter(t => Date.parse(t.when) > Date.now() - 30 * 3600e3); },
    save(list) { list.sort((a, b) => Date.parse(a.when) - Date.parse(b.when)); store.set('ferd:trips', list); },
    same(t, names, when) { return t.when === when && [t.ident, t.q].some(n => n && names.includes(n)); },
    has(names, when) { return this.all().some(t => this.same(t, names, when)); },
    toggle(t, names) {
      const list = this.all();
      const rest = list.filter(x => !this.same(x, names, t.when));
      this.save(rest.length < list.length ? rest : [...list, t]);
    },
    remove(i) { const list = this.all(); list.splice(i, 1); this.save(list); }
  };
  const fNames = f => [fIdent(f), f.ident_iata, f.ident_icao, f.ident, fsData && fsData.ident].filter(Boolean);

  // Times in the airport's own time zone, with the day when it isn't today there
  function fmtTime(isoStr, tz, withDay) {
    if (!isoStr) return '—';
    const d = new Date(isoStr), o = tz ? { timeZone: tz } : {};
    const t = d.toLocaleTimeString([], { ...o, hour: '2-digit', minute: '2-digit' });
    const day = x => x.toLocaleDateString('en-GB', { ...o, year: 'numeric', month: 'numeric', day: 'numeric' });
    if (!withDay && day(d) === day(new Date())) return t;
    return `${d.toLocaleDateString('en-GB', { ...o, weekday: 'short', day: 'numeric' })} ${t}`;
  }
  const mins = ms => Math.round(ms / 60000);
  function dur(ms) {
    const m = Math.abs(mins(ms)), h = Math.floor(m / 60);
    return h ? `${h} h ${m % 60} min` : `${m} min`;
  }
  const apLabel = a => a ? (a.code_iata || a.code_icao || a.code || '') : '';
  // Flight number as passengers know it: BA2702 rather than FlightAware's operator code (EFW2702 / AO2702)
  const fIdent = f => flightInfo((f.ident_icao || f.ident || '').toUpperCase()).flightNo || f.ident_iata || f.ident || '';

  // One-line state of a flight + colour
  function flightState(f) {
    const now = Date.now();
    if (f.cancelled) return ['Cancelled', 'bad'];
    if (f.diverted) return ['Diverted', 'bad'];
    const late = s => s >= 15 * 60 ? ` · ${dur(s * 1000)} late` : '';
    if (f.actual_in || f.actual_on) return [`Landed${late(f.arrival_delay || 0)}`, (f.arrival_delay || 0) >= 15 * 60 ? 'warn' : 'good'];
    if (f.actual_off || f.actual_out) {
      const eta = f.estimated_in || f.estimated_on;
      return [`${f.actual_off ? 'In the air' : 'Left the gate'}${eta ? ` · lands in ${dur(Date.parse(eta) - now)}` : ''}`,
        (f.arrival_delay || 0) >= 15 * 60 ? 'warn' : 'good'];
    }
    const delay = f.departure_delay || 0;
    if (delay >= 15 * 60) return [`Delayed ${dur(delay * 1000)}`, 'warn'];
    const dep = Date.parse(f.estimated_out || f.scheduled_out);
    return [dep > now ? `On time · departs in ${dur(dep - now)}` : 'On time', 'good'];
  }

  function legHtml(label, ap, act, est, sch, gate, term) {
    const t = act || est || sch;
    const kind = act ? (label === 'Departure' ? 'Departed' : 'Arrived') : est ? 'Expected' : 'Scheduled';
    const diff = sch && t && Math.abs(Date.parse(t) - Date.parse(sch)) >= 60000;
    const where = [term && `Terminal ${term}`, gate && `Gate ${gate}`].filter(Boolean).join(' · ');
    return `<div class="leg"><div class="k">${label}</div>
      <div><span class="ap">${esc(apLabel(ap))}</span> <span class="city">${esc(ap?.city || ap?.name || '')}</span></div>
      <div class="t">${esc(fmtTime(t, ap?.timezone))}</div>
      <div class="s">${kind}${diff ? ` · sched ${esc(fmtTime(sch, ap?.timezone))}` : ''}</div>
      ${where ? `<div class="s">${esc(where)}</div>` : ''}</div>`;
  }

  // Where the aircraft for our flight is now (c = its current/last flight), the flight that
  // brings it to us (k = inbound), and whether it will make it in time
  const landed = x => !!(x && (x.actual_in || x.actual_on));
  const flying = x => !!(x && (x.actual_off || x.actual_out) && !landed(x));
  function legText(x) {
    const route = `${apLabel(x.origin)} → ${apLabel(x.destination)}`;
    if (x.cancelled) return `${fIdent(x)} ${route} is cancelled.`;
    if (landed(x)) return `Landed in ${x.destination?.city || apLabel(x.destination)} at ${fmtTime(x.actual_in || x.actual_on, x.destination?.timezone)} on ${fIdent(x)} from ${apLabel(x.origin)}.`;
    if (flying(x)) return `In the air on ${fIdent(x)} ${route}, lands ${fmtTime(x.estimated_in || x.estimated_on || x.scheduled_in, x.destination?.timezone)}.`;
    return `${fIdent(x)} ${route}: departs ${fmtTime(x.estimated_out || x.scheduled_out, x.origin?.timezone)}, lands ${fmtTime(x.estimated_in || x.scheduled_in, x.destination?.timezone)}.`;
  }
  function inboundHtml(f, k, c) {
    if (f.actual_out || f.actual_off || f.cancelled) return '';
    if (!f.registration) return `<div class="inb"><div class="k">Aircraft</div>Not assigned yet. Airlines often assign it on the day.</div>`;
    if (!k && !c) return '';
    const lines = [];
    if (c) lines.push(`<div>${esc(legText(c))}</div>`);
    if (k && (!c || k.fa_flight_id !== c.fa_flight_id)) lines.push(`<div>Next: ${esc(legText(k))}</div>`);
    const where = lines.join('');

    let verdict = '';
    if (!k) return `<div class="inb"><div class="k">Your aircraft now · ${esc(f.registration)}</div>${where}</div>`;
    const arrive = Date.parse(k.actual_in || k.actual_on || k.estimated_in || k.estimated_on || k.scheduled_in || 0);
    const dep = Date.parse(f.scheduled_out || 0);
    if (arrive && dep && !k.cancelled) {
      const gap = dep - arrive;
      if (k.actual_in || k.actual_on) verdict = `<div class="verdict good">The aircraft is already there.</div>`;
      else if (gap < 0) verdict = `<div class="verdict bad">Due ${dur(-gap)} after your scheduled departure. Expect a delay.</div>`;
      else if (gap < 35 * 60000) verdict = `<div class="verdict warn">Tight: due ${dur(gap)} before your scheduled departure.</div>`;
      else verdict = `<div class="verdict good">Due ${dur(gap)} before your scheduled departure.</div>`;
    }
    return `<div class="inb"><div class="k">Your aircraft now · ${esc(f.registration)}</div>${where}${verdict}</div>`;
  }

  function renderFs() {
    if (!fsData) return;
    const { flights, inbound, index } = fsData;
    const body = $('fs-body');
    if (fsData.error) {
      $('fs-id').textContent = fsData.ident; $('fs-sub').textContent = '';
      body.innerHTML = `<div class="fs-msg">${esc(fsData.error)}</div>`;
      $('fs-save').style.display = $('fs-show').style.display = 'none';
      return;
    }
    if (!flights) { body.innerHTML = '<div class="fs-msg">Looking up…</div>'; return; }
    const f = flights[fsShow];
    const al = flightInfo((f.ident_icao || f.ident || '').toUpperCase()).airline;
    $('fs-id').textContent = fIdent(f);
    $('fs-sub').textContent = [al, f.ident_icao && f.ident_icao !== fIdent(f) ? f.ident_icao : '', f.aircraft_type, f.registration].filter(Boolean).join(' · ');
    const days = flights.length > 1 ? `<div class="days">${flights.map((x, i) =>
      `<button data-i="${i}" class="${i === fsShow ? 'on' : ''}">${esc(fmtTime(x.scheduled_out, x.origin?.timezone, true))}</button>`).join('')}</div>` : '';
    const [state, cls] = flightState(f);
    body.innerHTML = days
      + `<div class="state ${cls}">${esc(state)}${f.status ? `<small>${esc(f.status)}</small>` : ''}</div>`
      + `<div class="legs">${legHtml('Departure', f.origin, f.actual_out, f.estimated_out, f.scheduled_out, f.gate_origin, f.terminal_origin)}`
      + `${legHtml('Arrival', f.destination, f.actual_in, f.estimated_in, f.scheduled_in, f.gate_destination, f.terminal_destination)}</div>`
      + (fsShow === index ? inboundHtml(f, inbound, fsData.current) : '');
    const when = f.scheduled_out;
    $('fs-save').style.display = '';
    $('fs-save').textContent = trips.has(fNames(f), when) ? '★ Saved' : '☆ Save';
    $('fs-show').style.display = showTarget() ? '' : 'none';
  }

  // The aircraft worth showing: ours if it's flying, else wherever the assigned aircraft is now
  // (in the air, or on the ground where its last flight landed)
  function showTarget() {
    if (!fsData || !fsData.flights) return null;
    const f = fsData.flights[fsShow];
    if (flying(f)) return f;
    if (fsShow !== fsData.index) return null;
    const k = fsData.inbound, c = fsData.current;
    if (flying(k)) return k;
    if (c) return c;
    return null;
  }
  const regKey = r => (r || '').toUpperCase().replace(/-/g, '');
  function findPlane(t) {
    const reg = regKey(t.registration), cs = (t.atc_ident || t.ident_icao || t.ident || '').toUpperCase();
    for (const p of planes.values()) {
      if ((reg && regKey(p.d.reg) === reg) || (cs && p.d.cs.toUpperCase() === cs)) return p;
    }
    return null;
  }

  async function loadFs(ident, keepShow) {
    clearTimeout(fsTimer);
    try {
      const r = await fetch(`${RELAY}/flight?ident=${encodeURIComponent(ident)}`, { signal: AbortSignal.timeout(20000) });
      const j = await r.json().catch(() => ({}));
      if (!fsData || fsData.ident !== ident) return;   // panel closed or switched meanwhile
      if (r.status === 503) fsData.error = 'Flight status isn’t set up yet: the FlightAware key is missing from the relay.';
      else if (r.status === 404 || (r.ok && !(j.flights || []).length)) fsData.error = `No flight ${ident} found between yesterday and two days ahead.`;
      else if (!r.ok) fsData.error = `Couldn’t get the status (${(j.detail || [r.status]).join(', ')}).`;
      else {
        const prevShown = fsData.flights && fsData.flights[fsShow]?.fa_flight_id;
        Object.assign(fsData, j, { error: null });
        const i = keepShow && prevShown ? j.flights.findIndex(x => x.fa_flight_id === prevShown) : -1;
        fsShow = i >= 0 ? i : j.index;
      }
    } catch (e) {
      if (!fsData || fsData.ident !== ident) return;
      if (!fsData.flights) fsData.error = 'Couldn’t reach the relay. Try again in a moment.';
    }
    renderFs();
    if (fsData && !fsData.error) fsTimer = setTimeout(() => !document.hidden && fsData && loadFs(ident, true), FS_REFRESH_MS);
  }

  function openFs(ident) {
    ident = ident.toUpperCase().replace(/\s+/g, '');
    deselect();
    fsData = { ident }; fsShow = -1;
    $('fs-id').textContent = ident; $('fs-sub').textContent = '';
    $('fs-save').style.display = $('fs-show').style.display = 'none';
    renderFs();
    $('fs').classList.remove('hidden');
    document.body.classList.add('fs-open');
    loadFs(ident);
  }
  function closeFs() {
    clearTimeout(fsTimer);
    fsData = null;
    $('fs').classList.add('hidden');
    document.body.classList.remove('fs-open');
  }
  $('fs-close').onclick = closeFs;
  $('fs-body').addEventListener('click', e => {
    const b = e.target.closest('.days button');
    if (b) { fsShow = Number(b.dataset.i); renderFs(); }
  });
  $('fs-save').onclick = () => {
    const f = fsData?.flights?.[fsShow];
    if (!f) return;
    trips.toggle({ ident: fIdent(f), q: f.ident_icao || f.ident || fsData.ident, when: f.scheduled_out, from: apLabel(f.origin), to: apLabel(f.destination), tz: f.origin?.timezone }, fNames(f));
    renderFs();
  };
  $('fs-show').onclick = async () => {
    const t = showTarget();
    if (!t) return;
    const p = findPlane(t);
    if (p) { closeFs(); map.setView(p.m.getLatLng(), Math.max(map.getZoom(), 8)); select(p.d.id); return; }
    try {
      const r = await fetch(`${RELAY}/position?id=${encodeURIComponent(t.fa_flight_id)}`, { signal: AbortSignal.timeout(15000) });
      const j = await r.json();
      if (!j.position) throw new Error('no position');
      pendingFind = { t, until: Date.now() + 60000 };
      closeFs();
      map.setView([j.position.latitude, j.position.longitude], 8);   // moveend loads that area
    } catch { setStatus('Plane position not available right now'); }
  };
  $('s-status').onclick = () => {
    const d = planes.get(selected)?.d;
    if (d) openFs(d.flightNo || d.cs);
  };

  // ---------- search + suggestions ----------
  let sgItems = [], sgIdx = 0;

  function scoreAirport(a, q) {
    if (!q) return 9;
    const iata = norm(a.iata), icao = norm(a.icao), city = norm(a.city), name = norm(a.name);
    if (iata === q || icao === q) return 0;
    if (iata.startsWith(q)) return 1;
    if (icao.startsWith(q)) return 2;
    if (city.startsWith(q)) return 3;
    if (name.split(/[\s,\-\/()]+/).some(w => w.startsWith(q))) return 4;
    if (city.includes(q) || name.includes(q)) return 5;
    return -1;
  }
  function scoreFlight(d, q, qn) {
    const cs = d.cs.toUpperCase(), reg = d.reg.toUpperCase().replace(/-/g, ''), fn = d.flightNo;
    if (cs === q || fn === qn || (reg && reg === q.replace(/-/g, ''))) return 0;
    if (cs.startsWith(q) || (fn && fn.startsWith(qn)) || (reg && reg.startsWith(q.replace(/-/g, '')))) return 1;
    return -1;
  }
  const routeText = d => { const st = routeOf(d); return st ? st.map(apCode).join(' → ') : ''; };

  // "LHR BGO", "LHR-BGO", "LHR to BGO", "London > Bergen" -> { a, b } or null
  function makeSide(t, explicit) {
    if (!t) return null;
    const known = [...airportInfo.values()];
    if (known.some(a => norm(a.iata) === t || norm(a.icao) === t)) return { label: t, code: true, q: t };
    const hits = known.filter(a => { const s = scoreAirport(a, t); return s >= 0 && s <= 4; });
    if (hits.length) {
      const cities = new Set(hits.map(a => a.city).filter(Boolean));
      const label = cities.size === 1 ? [...cities][0]
        : t.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());
      return { label, code: false, q: t };
    }
    // A code for an airport with no flights in view yet still works as a filter
    if (/^[A-Z]{3}$/.test(t) || (explicit && /^[A-Z]{4}$/.test(t))) return { label: t, code: true, q: t };
    return null;
  }
  function parsePair(q) {
    const tryPair = (l, r, explicit) => {
      const a = makeSide(l.trim(), explicit), b = makeSide(r.trim(), explicit);
      return a && b && !(a.code && b.code && a.q === b.q) ? { a, b } : null;
    };
    const parts = q.split(/\s*(?:→|->|<->|⇄|>|–|—|,)\s*|\s+-\s+|\s+TO\s+/).filter(Boolean);
    if (parts.length === 2) return tryPair(parts[0], parts[1], true);
    const m = /^([A-Z]{3,4})-([A-Z]{3,4})$/.exec(q);
    if (m) return tryPair(m[1], m[2], true);
    // Plain spaces: only when the whole text isn't itself an airport ("New York")
    const words = q.split(' ');
    if (words.length < 2) return null;
    if ([...airportInfo.values()].some(a => { const s = scoreAirport(a, q); return s >= 0 && s <= 4; })) return null;
    for (let k = 1; k < words.length; k++) {
      const p = tryPair(words.slice(0, k).join(' '), words.slice(k).join(' '), false);
      if (p) return p;
    }
    return null;
  }

  function renderSuggest() {
    const box = $('suggest');
    const raw = $('q').value.trim();
    const q = norm(raw).replace(/\s+/g, ' ');
    const qn = q.replace(/\s+/g, '').replace(/^([A-Z0-9]{2})0+(?=\d)/, '$1');   // DY0123 -> DY123
    const counts = airportCounts();

    const aps = [];
    for (const [k, c] of counts) {
      const a = airportInfo.get(k);
      if (!a) continue;
      const s = scoreAirport(a, q);
      if (s >= 0) aps.push({ a, c, s, total: c.dep + c.arr });
    }
    aps.sort((x, y) => x.s - y.s || y.total - x.total || x.a.key.localeCompare(y.a.key));

    const pair = q ? parsePair(q) : null;
    const pairRows = [], fls = [];
    if (pair) {
      const f = { ...pair, dir: 'both' };
      for (const p of planes.values()) if (matchFilter(p.d, f, 'both')) fls.push({ d: p.d, s: 1 });
      // Code: the airport's name. City/name: the airport codes it covers, e.g. "LHR, LGW".
      const sideDesc = s => s.code ? (sideTitle(s) || s.label)
        : [...airportInfo.values()].filter(a => sideHas(s, a.key)).map(a => a.iata || a.icao).join(', ');
      const names = [pair.a, pair.b].map(sideDesc).join(' ⇄ ');
      pairRows.push({ item: { pair }, html: `<b>${esc(pair.a.label)} ⇄ ${esc(pair.b.label)}</b>`
        + `<span class="n">${esc(names)}</span>`
        + `<span class="c">${fls.length ? `${fls.length} flight${fls.length === 1 ? '' : 's'}` : 'none in view'}</span>` });
    } else if (q) {
      for (const p of planes.values()) {
        const s = scoreFlight(p.d, q.replace(/\s+/g, ''), qn);
        if (s >= 0) fls.push({ d: p.d, s });
      }
      fls.sort((x, y) => x.s - y.s || (x.d.flightNo || x.d.cs).localeCompare(y.d.flightNo || y.d.cs));
    }

    const apRows = aps.slice(0, q ? 8 : 60).map(({ a, c }) => {
      const name = a.city && !norm(a.name).includes(norm(a.city)) ? `${a.city} · ${a.name}` : (a.name || a.city);
      return { item: { ap: a.key }, html: `<b>${esc(a.iata || a.icao)}</b><span class="n">${esc(name)}</span>`
        + `<span class="c">${c.dep} dep · ${c.arr} arr</span>` };
    });
    const flRows = fls.slice(0, 6).map(({ d }) => ({
      item: { id: d.id },
      html: `<b>${esc(d.flightNo || d.cs || d.reg)}</b><span class="n">${esc([routeText(d), d.airline].filter(Boolean).join(' · '))}</span>`
        + `<span class="c">${esc(d.type)}</span>`
    }));

    const sections = [['Airports in view', apRows], ['Flights', flRows]];
    if (fls.length && fls[0].s === 0) sections.reverse();   // an exact flight match goes first
    if (pairRows.length) sections.unshift(['Between', pairRows]);

    // Flight status lookup for anything shaped like a flight number (DY1306, NOZ1306)
    const fq = q.replace(/\s+/g, '').replace(/^([A-Z0-9]{2})0+(?=\d)/, '$1');
    if (!pair && isFlightNo(fq)) {
      const row = { item: { status: fq }, html: `<b>${esc(fq)}</b><span class="n">Status, times and where the aircraft is</span>` };
      const inView = fls.length && fls[0].s === 0;
      sections.splice(inView ? 1 : 0, 0, ['Flight status', [row]]);
    }
    // Saved flights when nothing is typed
    if (!q) {
      const mine = trips.all().map((t, i) => ({ item: { status: t.q || t.ident },
        html: `<b>${esc(t.ident)}</b><span class="n">${esc(`${t.from} → ${t.to}`)}</span><span class="c">${esc(fmtTime(t.when, t.tz, true))}</span>`
          + `<button class="rm" data-rm="${i}" aria-label="Remove ${esc(t.ident)}">×</button>` }));
      if (mine.length) sections.unshift(['My flights', mine]);
    }

    sgItems = [];
    let html = '';
    for (const [title, rows] of sections) {
      if (!rows.length) continue;
      html += `<div class="sg-h">${title}</div>`;
      for (const r of rows) html += `<div class="sg" role="option" data-i="${sgItems.push(r.item) - 1}">${r.html}</div>`;
    }
    if (!sgItems.length) {
      const pending = routeQueue.length + routeActive;
      html = `<div class="sg-empty">${!q && pending ? 'Looking up routes…'
        : q ? `Nothing matching “${esc(raw)}” in view${pending ? ' yet' : ''}` : 'No routes known for aircraft in view'}</div>`;
    }
    sgIdx = Math.min(sgIdx, Math.max(0, sgItems.length - 1));
    box.innerHTML = html;
    markActive();
  }
  function markActive() {
    for (const el of $('suggest').querySelectorAll('.sg')) {
      const on = Number(el.dataset.i) === sgIdx;
      el.classList.toggle('act', on);
      if (on) el.scrollIntoView({ block: 'nearest' });
    }
  }
  function openSuggest() { $('suggest').classList.add('open'); renderSuggest(); }
  function closeSuggest() { $('suggest').classList.remove('open'); }
  function pick(item) {
    if (!item) return;
    $('q').value = '';
    closeSuggest();
    $('q').blur();
    if (item.ap) setFilter({ a: codeSide(item.ap), b: null, dir: 'all' });
    else if (item.pair) setFilter({ ...item.pair, dir: 'both' });
    else if (item.status) openFs(item.status);
    else {
      const p = planes.get(item.id);
      if (p) { map.setView(p.m.getLatLng(), Math.max(map.getZoom(), 9)); select(item.id); }
    }
  }

  $('q').addEventListener('focus', openSuggest);
  $('q').addEventListener('input', () => { sgIdx = 0; openSuggest(); });
  $('q').addEventListener('blur', () => setTimeout(closeSuggest, 150));
  $('q').addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!sgItems.length) return;
      sgIdx = (sgIdx + (e.key === 'ArrowDown' ? 1 : -1) + sgItems.length) % sgItems.length;
      markActive();
    } else if (e.key === 'Enter') {
      if (sgItems.length) pick(sgItems[sgIdx]);
      else if (e.target.value.trim()) setStatus(`${e.target.value.trim().toUpperCase()} not in view`);
    } else if (e.key === 'Escape') {
      closeSuggest(); e.target.blur();
    }
  });
  // Keep the input focused while tapping a suggestion, then pick it.
  $('suggest').addEventListener('mousedown', e => e.preventDefault());
  $('suggest').addEventListener('click', e => {
    const rm = e.target.closest('[data-rm]');
    if (rm) { trips.remove(Number(rm.dataset.rm)); renderSuggest(); if (fsData) renderFs(); return; }
    const el = e.target.closest('.sg');
    if (el) pick(sgItems[Number(el.dataset.i)]);
  });

  // ---------- location ----------
  let me;
  $('locate').onclick = () => {
    if (!navigator.geolocation) return setStatus('Location not available');
    navigator.geolocation.getCurrentPosition(pos => {
      const ll = [pos.coords.latitude, pos.coords.longitude];
      if (me) me.setLatLng(ll);
      else me = L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [14, 14] }), interactive: false }).addTo(map);
      map.setView(ll, 9);
    }, () => setStatus('Location permission denied'), { enableHighAccuracy: false, timeout: 10000 });
  };

  // ---------- scheduling ----------
  map.on('moveend', () => {
    const c = map.getCenter();
    store.set('ferd:view', { lat: c.lat, lon: c.lng, z: map.getZoom() });
    clearTimeout(pending);
    const wait = Math.max(600, lastFetch + MIN_GAP_MS - Date.now());
    pending = setTimeout(load, wait);
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && Date.now() - lastFetch > REFRESH_MS) load();
  });
  setInterval(() => {
    animate();
    if (Date.now() - lastFetch >= REFRESH_MS) load();
  }, 1000);

  load();
})();
</script>
</body>
</html>
